<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Validación con keyup</title>
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="estilo.css"><script src="ejercicio.js" defer></script><script src="../../../navegacion/secciones.js" defer></script>
<script src="../../../navegacion/menu.js" defer></script>
</head>
<body>
<h1>Ejercicio: validación de un INPUT de formulario en el evento onKeyUp</h1>
<form id="formulario" novalidate><label for="dia">Ingrese el día del mes:</label><input id="dia" name="dia" type="number" min="1" max="31" step="1" required>
<label for="mes">Ingrese el mes:</label><input id="mes" name="mes" type="number" min="1" max="12" step="1" required>
<div class="acciones"><button id="enviar" type="button">Enviar</button><button id="blanquear" type="button">Reset</button></div><p id="mensaje" class="mensaje" role="status"></p></form>
<footer><a href="../index.html">Volver a JavaScript · Parte 2</a></footer>
</body>
</html>
