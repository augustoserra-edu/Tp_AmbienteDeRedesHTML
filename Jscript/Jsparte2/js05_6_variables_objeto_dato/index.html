<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables de tipo objeto</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="estilo.css">
    <script src="ejercicio.js" defer></script>
</head>

<body>

    <main class="paneles">
        <section class="ingreso">
            <h2>Ingreso de datos de persona:</h2>
            <label for="nombre">Nombre:</label><input id="nombre" required autocomplete="given-name">
            <label for="apellido">Apellido:</label><input id="apellido" required autocomplete="family-name">
            <label for="nacimiento">Fecha de nacimiento:</label><input id="nacimiento" type="text" required
                placeholder="dd/mm/aaaa" maxlength="10" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}"
                title="Ingresá la fecha en formato dd/mm/aaaa" aria-describedby="mensaje">
        </section>
        <section class="control">
            <h2>Control</h2><button id="crear" type="button">Crea persona</button> <button id="listar"
                type="button">Lista personas</button> <button id="ocultar" type="button">Oculta presentación</button>
            <p id="mensaje" class="mensaje" role="status"></p>
        </section>
    </main>
    <section id="presentacion" aria-label="Presentación de personas"></section>
    <footer><a href="../index.html">Volver a JavaScript · Parte 2</a></footer>
</body>

</html>
