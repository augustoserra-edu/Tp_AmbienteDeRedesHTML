<main class="calculadora">
<input id="display" type="text" inputmode="numeric" pattern="[+\-]?[0-9]+" required aria-label="Display">

<div class="acciones"><button type="button" id="acumular">+Acumulador</button><button type="button" id="mostrar">Muestra Acumulador</button><button type="button" id="borrar-acumulador">Borra Acumulador</button><button type="button" id="borrar-display">Borra display</button></div>

</main>
<p>Ingresá números enteros para realizar las operaciones.</p>
<footer><a href="../index.html">Volver a JavaScript · Parte 1</a></footer>
