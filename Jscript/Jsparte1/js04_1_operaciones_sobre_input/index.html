<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operaciones sobre un input</title>
<link rel="stylesheet" href="../base.css">
<script src="../numeros.js" defer></script>
<script src="ejercicio.js" defer></script>
</head>
<body>
<h3>Introducir un valor en el cuadro de texto y luego pulsar el botón para ejecutar el procedimiento correspondiente.</h3>
<div class="controles"><input id="valor" type="text" inputmode="numeric" pattern="[+\-]?[0-9]+" required aria-label="Valor"><button type="button" id="mostrar">Muestra valor</button><button type="button" id="sumar">Suma 1</button><button type="button" id="cuadrado">x**2</button><button type="button" id="doble">Multiplica * 2</button><button type="button" id="potencia">2**x</button></div>

<p>Ingresá números enteros para realizar las operaciones.</p>
<footer><a href="../index.html">Volver a JavaScript · Parte 1</a></footer>
</body>
</html>
