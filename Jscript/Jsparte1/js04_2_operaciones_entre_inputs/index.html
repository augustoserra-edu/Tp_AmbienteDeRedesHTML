<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operaciones entre inputs</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="estilo.css">
<script src="../numeros.js" defer></script>
<script src="ejercicio.js" defer></script>
<script src="../../../navegacion/secciones.js" defer></script>
<script src="../../../navegacion/menu.js" defer></script>
</head>
<body>
<h3>Introducir un valor en los cuadros de texto y luego pulsar el botón para ejecutar la función correspondiente.</h3>
<div class="entradas"><label for="entrada1">Entrada 1:</label><input id="entrada1" type="text" inputmode="numeric" pattern="[+\-]?[0-9]+" required value="0">
<label for="entrada2">Entrada 2:</label><input id="entrada2" type="text" inputmode="numeric" pattern="[+\-]?[0-9]+" required value="0">
<label for="entrada3">Entrada 3:</label><input id="entrada3" type="text" inputmode="numeric" pattern="[+\-]?[0-9]+" required value="0">
<label for="resultado">Resultado:</label><input id="resultado" readonly></div>
<div class="controles"><button type="button" id="sumar">Suma</button><button type="button" id="promediar">Promedia</button><button type="button" id="mayor">Mayor</button></div>
<p>Ingresá números enteros para realizar las operaciones.</p>
<footer><a href="../index.html">Volver a JavaScript · Parte 1</a></footer>
</body>
</html>
