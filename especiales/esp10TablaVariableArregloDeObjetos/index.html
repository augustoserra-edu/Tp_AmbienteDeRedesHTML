<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla · Renglones de pedido</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="../unidadesDeMedida.js" defer></script>

    <script src="ejercicio.js" defer></script>

                <tr>
                    <th scope="col">Número de pedido</th>

                    <th scope="col">Comprobante PDF</th>
                </tr>
            </thead>
            <tbody id="tbDatos"></tbody>
            <tfoot>
                <tr>
                    <td>Número de pedido</td>
                    <td>Código de artículo</td>
                    <td>Descripción</td>
                    <td>Unidad de medida</td>
                    <td>Cantidad</td>

                    <td>Comprobante PDF</td>

    <footer>
        <span id="estado" role="status">Tabla vacía</span>
        <a href="../index.html">Volver a Especiales</a>
