<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario adaptable</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header><h1>Formulario</h1></header>
<form id="formulario">
<div class="campos"><div class="entrada"><label for="apellido">1 Apellido:</label><br><input id="apellido" name="apellido" type="text" autocomplete="family-name" required></div>
<div class="entrada"><label for="nombres">2 Nombres:</label><br><input id="nombres" name="nombres" type="text" autocomplete="given-name" required></div>
<div class="entrada"><label for="clave">3 Contraseña:</label><br><input id="clave" name="clave" type="password" autocomplete="new-password"></div>
<div class="entrada"><label for="deshabilitado">4 Campo deshabilitado:</label><br><input id="deshabilitado" name="deshabilitado" type="text" value="valor deshabilitado" disabled></div>
<div class="entrada"><label for="fecha">5 Fecha:</label><br><input id="fecha" name="fecha" type="date" ></div>
<div class="entrada"><label for="dni">6 DNI:</label><br><input id="dni" name="dni" type="text" inputmode="numeric" pattern="[0-9]{7,8}" title="Ingresá 7 u 8 dígitos"></div>
<div class="entrada"><fieldset><legend>7 Actividades extracurriculares</legend><label for="musica">Música:</label><br><input id="musica" type="checkbox" name="actividades" value="musica"><br><label for="pintura">Pintura artística:</label><br><input id="pintura" type="checkbox" name="actividades" value="pintura"></fieldset></div>
<div class="entrada"><fieldset><legend>8 Sexo:</legend><label for="masculino">Masculino:</label><br><input id="masculino" type="radio" name="sexo" value="masculino" checked><br><label for="femenino">Femenino:</label><br><input id="femenino" type="radio" name="sexo" value="femenino"></fieldset></div>
<div class="entrada"><h2>9 Vacío</h2></div>
<div class="entrada"><label for="estudios">10 Estudios cursados</label><br><select id="estudios" name="estudios"><option>Primarios</option><option>Secundarios</option><option>Terciarios</option><option>Universitarios</option></select></div>
<div class="entrada"><label for="area">11 Área de desempeño</label><br><select id="area" name="area"><option>Administración</option><option>Sistemas</option><option>Ventas</option><option>Producción</option></select></div>
<div class="entrada"><label for="turno">12 Turno</label><br><select id="turno" name="turno"><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div>
<div class="entrada"><fieldset><legend>13 Conduce</legend><input id="conduce-si" type="radio" name="conduce" value="si" checked><label for="conduce-si">Sí</label> <input id="conduce-no" type="radio" name="conduce" value="no"><label for="conduce-no">No</label></fieldset></div></div>
<div class="acciones"><button type="submit">Enviar</button><button type="reset">Reset</button></div>
<p id="resultado" role="status" hidden></p>
</form>
<footer><h2>Pie de formulario</h2><a href="../index.html">Volver a CSS · Parte 2</a></footer>
<script src="formulario.js"></script>
</body>
</html>
