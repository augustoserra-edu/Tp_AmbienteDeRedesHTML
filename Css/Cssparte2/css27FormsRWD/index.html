<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario RWD</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="formulario.js" defer></script>
<script src="../../../navegacion/secciones.js" defer></script>
<script src="../../../navegacion/menu.js" defer></script>
</head>
<body>
<header><h1>Formulario</h1></header>
<form id="formulario">
    <div class="campos">
        <div class="entrada"><label for="apellido">1 Apellido:</label><input id="apellido" name="apellido" required></div>
        <div class="entrada"><label for="nombres">2 Nombres:</label><input id="nombres" name="nombres" required></div>
        <div class="entrada"><label for="clave">3 Contraseña:</label><input id="clave" type="password" autocomplete="new-password"></div>
        <div class="entrada"><label for="deshabilitado">4 Campo deshabilitado:</label><input id="deshabilitado" value="valor deshabilitado" disabled></div>
        <div class="entrada"><label for="fecha">5 Fecha:</label><input id="fecha" name="fecha" type="date"></div>
        <div class="entrada"><label for="dni">6 DNI:</label><input id="dni" name="dni" inputmode="numeric" pattern="[0-9]{7,8}" maxlength="8"></div>
        <div class="entrada"><strong>7 Actividades extracurriculares</strong><label for="musica">Música:</label><input id="musica" name="musica" type="checkbox"><label for="pintura">Pintura artística:</label><input id="pintura" name="pintura" type="checkbox"></div>
        <div class="entrada">8 Sexo:<label for="masculino">Masculino:</label><input id="masculino" name="sexo" value="masculino" type="radio" checked><label for="femenino">Femenino:</label><input id="femenino" name="sexo" value="femenino" type="radio"></div>
        <div class="entrada"><h2>9 Vacío</h2></div>
        <div class="entrada"><label for="estudios">10 Estudios cursados:</label><select id="estudios" name="estudios"><option>Primarios</option><option>Secundarios</option><option>Terciarios</option><option>Universitarios</option></select></div>
        <div class="entrada"><label for="area">11 Área de desempeño:</label><select id="area" name="area"><option>Administración</option><option>Producción</option><option>Sistemas</option><option>Ventas</option></select></div>
        <div class="entrada"><label for="turno">12 Turno:</label><select id="turno" name="turno"><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div>
        <div class="entrada">13 Conduce:<div><label class="enLinea" for="conduce-si"><input id="conduce-si" name="conduce" value="si" type="radio" checked>Sí</label> <label class="enLinea" for="conduce-no"><input id="conduce-no" name="conduce" value="no" type="radio">No</label></div></div>
        <div class="nuevaFila"></div>
    </div>
    <div class="barraControl"><button class="boton" type="submit">Enviar</button><button class="boton" type="reset">Reset</button></div>
</form>
<footer><h2>Pie de formulario</h2><span id="resultado" role="status"></span> <a class="volver" href="../index.html">Volver a CSS · Parte 2</a></footer>
</body>
</html>
