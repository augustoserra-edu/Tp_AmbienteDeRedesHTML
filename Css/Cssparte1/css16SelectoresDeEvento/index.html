<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selectores de eventos</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main class="contenedor">
<nav aria-label="Opciones"><a href="respuesta1.html">Opción 1.</a><a href="respuesta2.html">Opción 2.</a><a href="respuesta3.html">Opción 3.</a></nav>
<form>
<label for="apellido">Apellido:</label><br>
<input id="apellido" name="apellido" type="text" autocomplete="family-name"><br>
<label for="nombres">Nombres:</label><br>
<input id="nombres" name="nombres" type="text" autocomplete="given-name">
</form>
<h1>Expandir la imagen al 30% del contenedor padre con un click</h1>
<div class="galeria">
<button class="imagen" type="button" aria-label="Ampliar Monte Fuji"><img src="../imagenes/monte-fuji.jpg" alt="Monte Fuji"></button>
<button class="imagen" type="button" aria-label="Ampliar tigre"><img src="../imagenes/tigre.jpg" alt="tigre"></button>
<button class="imagen" type="button" aria-label="Ampliar paisaje de montaña"><img src="../imagenes/paisaje.jpg" alt="paisaje de montaña"></button>
<button class="imagen" type="button" aria-label="Ampliar flores"><img src="../imagenes/flores.jpg" alt="flores"></button>
</div>
</main>
<footer><a href="../index.html">Volver a CSS · Parte 1</a></footer>
</body>
</html>
